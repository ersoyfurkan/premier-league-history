name: Refresh live football facts

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx scripts/refresh-live-facts.mts
      - run: npx --yes tsx scripts/refresh-wiki-facts.mts
      - run: npx --yes tsx scripts/refresh-tournament-history.mts
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/liveFacts.generated.json data/wikiFacts.generated.json data/tournamentHistory.generated.json
          git diff --cached --quiet || git commit -m "chore: refresh live football facts"
          git push
