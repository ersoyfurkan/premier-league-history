name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository Actions secret before deploying."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare and test quiz data
        run: |
          pnpm data:quiz
          pnpm test:stat-games
      - name: Build Worker
        run: pnpm build
      - name: Prepare Formation Invasion rooms
        run: pnpm exec wrangler d1 execute DB --remote --file migrations/0004_formation_invasion.sql --yes
      - name: Deploy Worker
        run: pnpm exec wrangler deploy --keep-vars --message "GitHub ${GITHUB_SHA}"
      - name: Check deployed game routes
        run: node scripts/check-deployed-games.mjs
